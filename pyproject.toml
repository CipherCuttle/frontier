[project]
name = "frontier-intelligence"
version = "0.1.0"
description = "FRONTIER canonical evidence substrate"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6.138,<7",
  "pyright>=1.1.405,<2",
  "pytest>=8.4,<9",
  "ruff>=0.14,<1",
]

[project.scripts]
frontier = "frontier.cli.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"migrations/**/*.py" = ["E501"]
