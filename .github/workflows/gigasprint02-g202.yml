name: GIGASPRINT02 G2-02 authority patch
on:
  push:
    branches:
      - agent/gigasprint-02-prefreeze-launch-integrity
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: frontier
          POSTGRES_PASSWORD: frontier
          POSTGRES_DB: frontier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frontier -d frontier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FRONTIER_TEST_DATABASE_URL: postgresql://frontier:frontier@localhost:5432/frontier
      FRONTIER_DATABASE_URL: postgresql+psycopg://frontier:frontier@localhost:5432/frontier
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - run: uv sync --all-extras --frozen
      - name: Apply guarded G2-02 payload
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          path = ".github/workflows/gigasprint02-g202.yml"
          source = subprocess.run(
              ["git", "show", "529ef98fc6cbfeb50ee69ec0716b7920f58422da:" + path],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end_marker = "\n          PY\n      - name: Verify G2-02"
          end = source.index(end_marker, start)
          raw_lines = source[start:end].splitlines()
          normalized = []
          inside_payload_string = False
          for line in raw_lines:
              stripped = line.lstrip()
              closing = inside_payload_string and stripped.startswith("''')")
              if (not inside_payload_string or closing) and line.startswith("          "):
                  line = line[10:]
              normalized.append(line)
              if line.count("'''") % 2 == 1:
                  inside_payload_string = not inside_payload_string
          payload = "\n".join(normalized) + "\n"
          compile(payload, "<g2-02-payload>", "exec")
          exec(payload, {"__name__": "__main__"})
          PY
      - name: Normalize generated source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/frontier/application/freeze_publication.py")
          source.write_bytes(source.read_bytes().replace(b"\x00", b"\\0"))

          test = Path("tests/unit/test_freeze_publication.py")
          lines = test.read_text(encoding="utf-8").splitlines()
          repaired = []
          skip = False
          for index, line in enumerate(lines):
              if skip:
                  skip = False
                  continue
              if 'path.write_text(canonical_json_text(receipt.to_canonical())+"' in line:
                  repaired.append(
                      '    path.write_text(canonical_json_text(receipt.to_canonical())+"\\n")'
                  )
                  if index + 1 < len(lines) and lines[index + 1].strip() == '")':
                      skip = True
              elif line.strip() == "import json":
                  continue
              else:
                  repaired.append(line)
          test.write_text("\n".join(repaired) + "\n", encoding="utf-8")

          pgtest = Path("tests/integration/test_freeze_publication_postgres.py")
          text = pgtest.read_text(encoding="utf-8")
          if not text.startswith("# ruff: noqa: E402\n"):
              text = "# ruff: noqa: E402\n" + text
          pgtest.write_text(text, encoding="utf-8")

          replacements = {
              "migrations/versions/0013_freeze_publication_authority.py": (
                  'revision = "0013_freeze_publication_authority"',
                  'revision = "0013_freeze_publication"',
              ),
              "src/frontier/adapters/postgres/readiness.py": (
                  'EXPECTED_DATABASE_REVISION = "0013_freeze_publication_authority"',
                  'EXPECTED_DATABASE_REVISION = "0013_freeze_publication"',
              ),
              "tests/integration/test_experiment_lifecycle_postgres.py": (
                  'assert readiness.migration_revision == "0013_freeze_publication_authority"',
                  'assert readiness.migration_revision == "0013_freeze_publication"',
              ),
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              body = path.read_text(encoding="utf-8")
              if body.count(old) != 1:
                  raise SystemExit(f"{filename}: expected exactly one revision replacement")
              path.write_text(body.replace(old, new), encoding="utf-8")
          PY
          uv run ruff format src/frontier/application/freeze_publication.py src/frontier/adapters/postgres/freeze_publication.py migrations/versions/0013_freeze_publication_authority.py tests/unit/test_freeze_publication.py tests/integration/test_freeze_publication_postgres.py src/frontier/application/candidate_freeze.py src/frontier/application/drift_sentry.py src/frontier/application/experiment_orchestration.py src/frontier/adapters/postgres/experiment_attempts.py src/frontier/adapters/postgres/readiness.py tests/unit/test_experiment_orchestration.py tests/unit/test_drift_sentry.py tests/integration/test_experiment_lifecycle_postgres.py
          python - <<'PY'
          from pathlib import Path

          adapter = Path("src/frontier/adapters/postgres/freeze_publication.py")
          text = adapter.read_text(encoding="utf-8")
          old = '                    "SELECT publication_digest FROM candidate_freeze_publications WHERE receipt_id=%s",\n'
          new = (
              '                    "SELECT publication_digest FROM candidate_freeze_publications "\n'
              '                    "WHERE receipt_id=%s",\n'
          )
          if text.count(old) != 1:
              raise SystemExit("freeze publication SQL wrap target missing")
          adapter.write_text(text.replace(old, new), encoding="utf-8")
          PY
          uv run ruff check --fix src/frontier/application/freeze_publication.py src/frontier/adapters/postgres/freeze_publication.py tests/unit/test_freeze_publication.py tests/integration/test_freeze_publication_postgres.py
      - name: Repair proven semantic regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1. The LATER/canonical-context fixture must have a valid publication
          # at or after DB durability so it reaches the intended canonical-context gate.
          path = Path("tests/unit/test_experiment_orchestration.py")
          text = path.read_text(encoding="utf-8")
          old = '''                publication_committer_at=(
                    None if binding == "NOT_DURABLE" else BOUNDARY - timedelta(seconds=301)
                ),
'''
          new = '''                publication_committer_at=(
                    None
                    if binding == "NOT_DURABLE"
                    else (
                        BOUNDARY - timedelta(seconds=300)
                        if binding == "LATER"
                        else BOUNDARY - timedelta(seconds=301)
                    )
                ),
'''
          if text.count(old) != 1:
              raise SystemExit("confirmatory fixture timestamp target missing")
          path.write_text(text.replace(old, new), encoding="utf-8")

          # 2. The freeze resolver joins two tables with implementation columns;
          # every receipt-side selected column must be explicitly qualified.
          path = Path("src/frontier/adapters/postgres/experiment_attempts.py")
          text = path.read_text(encoding="utf-8")
          old = '''                SELECT r.status, r.drift_reasons, r.preregistration_digest,
                       preregistration_config_digest, implementation_commit,
                       implementation_tree_digest, dependency_lock_digest,
                       source_registry_digest, registry_entry_digests,
                       receipt_digest, frozen_at, verified_at,
'''
          new = '''                SELECT r.status, r.drift_reasons, r.preregistration_digest,
                       r.preregistration_config_digest, r.implementation_commit,
                       r.implementation_tree_digest, r.dependency_lock_digest,
                       r.source_registry_digest, r.registry_entry_digests,
                       r.receipt_digest, r.frozen_at, r.verified_at,
'''
          if text.count(old) != 1:
              raise SystemExit("freeze resolver alias target missing")
          path.write_text(text.replace(old, new), encoding="utf-8")

          # 3. A valid receipt-only publication is the one special case where
          # HEAD may differ from the frozen implementation without drift. Invalid
          # or fabricated implementation refs should still compare against live
          # inputs so component-specific drift remains observable.
          path = Path("src/frontier/application/drift_sentry.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def _try_collect(self, receipt: CandidateFreezeReceipt | None = None) -> FreezeInputs | None:
        try:
            if receipt is None or receipt.implementation_commit is None:
                return collect_freeze_inputs(self._root)
            head = subprocess.run(
                ["git", "rev-parse", "HEAD"], cwd=self._root, capture_output=True,
                text=True, check=True, timeout=30
            ).stdout.strip()
            if head == receipt.implementation_commit:
                return collect_freeze_inputs(self._root)
            derive_freeze_publication(self._root, receipt)
            return collect_freeze_inputs(
                self._root, implementation_ref=receipt.implementation_commit
            )
        except (OSError, subprocess.SubprocessError, RuntimeError, ValueError):
            return None
'''
          new = '''    def _try_collect(self, receipt: CandidateFreezeReceipt | None = None) -> FreezeInputs | None:
        try:
            if receipt is None or receipt.implementation_commit is None:
                return collect_freeze_inputs(self._root)
            head = subprocess.run(
                ["git", "rev-parse", "HEAD"],
                cwd=self._root,
                capture_output=True,
                text=True,
                check=True,
                timeout=30,
            ).stdout.strip()
            if head == receipt.implementation_commit:
                return collect_freeze_inputs(self._root)
            try:
                subprocess.run(
                    ["git", "cat-file", "-e", f"{receipt.implementation_commit}^{{commit}}"],
                    cwd=self._root,
                    capture_output=True,
                    check=True,
                    timeout=30,
                )
            except subprocess.CalledProcessError:
                return collect_freeze_inputs(self._root)
            try:
                derive_freeze_publication(self._root, receipt)
            except (RuntimeError, ValueError):
                return collect_freeze_inputs(self._root)
            return collect_freeze_inputs(
                self._root, implementation_ref=receipt.implementation_commit
            )
        except (OSError, subprocess.SubprocessError):
            return None
'''
          if text.count(old) != 1:
              raise SystemExit("drift sentry collection target missing")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          uv run ruff format src/frontier/application/drift_sentry.py src/frontier/adapters/postgres/experiment_attempts.py tests/unit/test_experiment_orchestration.py
      - name: Verify G2-02
        shell: bash
        run: |
          uv run ruff check src/frontier/application/freeze_publication.py src/frontier/adapters/postgres/freeze_publication.py migrations/versions/0013_freeze_publication_authority.py tests/unit/test_freeze_publication.py tests/integration/test_freeze_publication_postgres.py src/frontier/application/candidate_freeze.py src/frontier/application/drift_sentry.py src/frontier/application/experiment_orchestration.py src/frontier/adapters/postgres/experiment_attempts.py src/frontier/adapters/postgres/readiness.py tests/unit/test_experiment_orchestration.py tests/unit/test_drift_sentry.py
          uv run pyright
          uv run alembic upgrade head
          uv run pytest -q tests/unit/test_freeze_publication.py tests/unit/test_confirmatory_freeze_binding.py tests/unit/test_experiment_orchestration.py tests/unit/test_drift_sentry.py tests/integration/test_freeze_publication_postgres.py tests/integration/test_drift_sentry_postgres.py
      - name: Commit G2-02 and remove runner
        shell: bash
        run: |
          rm .github/workflows/gigasprint02-g202.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(gigasprint02): bind confirmatory window to Git publication"
          git push origin HEAD:agent/gigasprint-02-prefreeze-launch-integrity
