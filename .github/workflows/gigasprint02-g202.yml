name: GIGASPRINT02 G2-02 authority patch
on:
  push:
    branches: [agent/gigasprint-02-prefreeze-launch-integrity]
permissions:
  contents: write
jobs:
  patch-and-test:
    if: "contains(github.event.head_commit.message, 'run G2-02 authority patch')"
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: frontier
          POSTGRES_PASSWORD: frontier
          POSTGRES_DB: frontier
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U frontier -d frontier"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FRONTIER_TEST_DATABASE_URL: postgresql://frontier:frontier@localhost:5432/frontier
      FRONTIER_DATABASE_URL: postgresql+psycopg://frontier:frontier@localhost:5432/frontier
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.10'}
      - run: uv sync --all-extras --frozen
      - name: Apply G2-02
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.')
          def rep(path, old, new, count=None):
              f=p/path; s=f.read_text()
              n=s.count(old)
              if count is not None and n != count: raise SystemExit(f'{path}: expected {count} matches, got {n}')
              if count is None and n < 1: raise SystemExit(f'{path}: old text missing')
              f.write_text(s.replace(old,new))

