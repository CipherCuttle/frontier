name: GIGASPRINT02 G2-01 fixture alignment

on:
  push:
    branches:
      - agent/gigasprint-02-prefreeze-launch-integrity

permissions:
  contents: write

jobs:
  patch-and-test:
    if: "${{ github.event.head_commit.message == 'chore(gigasprint02): align confirmatory test fixtures' }}"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: frontier
          POSTGRES_PASSWORD: frontier
          POSTGRES_DB: frontier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frontier -d frontier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FRONTIER_TEST_DATABASE_URL: postgresql://frontier:frontier@localhost:5432/frontier
      FRONTIER_E2E_DATABASE_URL: postgresql://frontier:frontier@localhost:5432/postgres
      FRONTIER_DATABASE_URL: postgresql+psycopg://frontier:frontier@localhost:5432/frontier
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gigasprint-02-prefreeze-launch-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Align confirmatory-only test fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one guarded fragment, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "tests/unit/test_drift_sentry.py",
              '''        baseline_repository=FakeBaselineRepository(()),\n        persistence=persistence,\n        source_registry_version=receipt.source_registry_digest or FABRICATED_REGISTRY,\n''',
              '''        baseline_repository=FakeBaselineRepository(\n            (),\n            confirmatory_source_registry_version=(\n                receipt.source_registry_digest or FABRICATED_REGISTRY\n            ),\n        ),\n        persistence=persistence,\n        source_registry_version=receipt.source_registry_digest or FABRICATED_REGISTRY,\n''',
          )

          replace_once(
              "tests/integration/test_drift_sentry_postgres.py",
              '''class _UnusedBaselineRepository:\n    """The drift path halts before any baseline work; never called."""\n\n    def list_baseline_observations_as_of(self, as_of: datetime) -> list[object]:\n''',
              '''class _UnusedBaselineRepository:\n    """The drift path halts before any baseline work; never called."""\n\n    confirmatory_source_registry_version = Digest("sha256:" + "4" * 64)\n\n    def list_baseline_observations_as_of(self, as_of: datetime) -> list[object]:\n''',
          )

          replace_once(
              "tests/integration/test_experiment_lifecycle_postgres.py",
              '''from frontier.adapters.postgres.intelligence import PostgresBaselineIntelligenceRepository\n''',
              '''from frontier.adapters.postgres.frozen_registry_intelligence import (\n    PostgresFrozenRegistryBaselineIntelligenceRepository,\n)\nfrom frontier.adapters.postgres.intelligence import PostgresBaselineIntelligenceRepository\n''',
          )

          replace_once(
              "tests/integration/test_experiment_lifecycle_postgres.py",
              '''def _orchestrator(\n    connection: ConnectionT, *, run_class: str, worker_id: str\n) -> ExperimentOrchestrator:\n    return ExperimentOrchestrator(\n        attempts=PostgresExperimentAttemptRepository(connection),\n        baseline_repository=PostgresBaselineIntelligenceRepository(connection),\n        persistence=PostgresShadowRunPersister(connection),\n        source_registry_version=REGISTRY_VERSION,\n''',
              '''def _orchestrator(\n    connection: ConnectionT, *, run_class: str, worker_id: str\n) -> ExperimentOrchestrator:\n    baseline_repository = (\n        PostgresFrozenRegistryBaselineIntelligenceRepository(\n            connection, load_source_registry(ROOT)\n        )\n        if run_class == "CONFIRMATORY"\n        else PostgresBaselineIntelligenceRepository(connection)\n    )\n    return ExperimentOrchestrator(\n        attempts=PostgresExperimentAttemptRepository(connection),\n        baseline_repository=baseline_repository,\n        persistence=PostgresShadowRunPersister(connection),\n        source_registry_version=REGISTRY_VERSION,\n''',
          )
          PY

      - name: Verify aligned fixtures
        shell: bash
        run: |
          uv lock --check
          uv sync --all-extras --frozen
          uv run ruff format tests/unit/test_drift_sentry.py tests/integration/test_drift_sentry_postgres.py tests/integration/test_experiment_lifecycle_postgres.py
          uv run ruff check tests/unit/test_drift_sentry.py tests/integration/test_drift_sentry_postgres.py tests/integration/test_experiment_lifecycle_postgres.py
          uv run pyright tests/unit/test_drift_sentry.py tests/integration/test_drift_sentry_postgres.py tests/integration/test_experiment_lifecycle_postgres.py
          FRONTIER_DATABASE_URL="$FRONTIER_DATABASE_URL" uv run alembic upgrade head
          uv run pytest -q tests/unit/test_drift_sentry.py tests/integration/test_drift_sentry_postgres.py
          uv run pytest -q tests/integration/test_experiment_lifecycle_postgres.py

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gigasprint02-g201-fixture-repair.yml
          git add tests/unit/test_drift_sentry.py tests/integration/test_drift_sentry_postgres.py tests/integration/test_experiment_lifecycle_postgres.py
          git commit -m "test(pef): align confirmatory fixtures with frozen registry"
          git push origin HEAD:agent/gigasprint-02-prefreeze-launch-integrity
