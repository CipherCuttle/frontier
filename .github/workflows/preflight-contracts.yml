name: preflight-contracts

on:
  pull_request:
    paths:
      - "contracts/**"
      - "sources/registry/**"
      - "policies/fetch/**"
      - "docs/preflight/PR02_EXECUTABLE_CONTRACT_V0.md"
      - "scripts/preflight/validate_pr02_contracts.py"
      - ".github/workflows/preflight-contracts.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "sources/registry/**"
      - "policies/fetch/**"
      - "docs/preflight/PR02_EXECUTABLE_CONTRACT_V0.md"
      - "scripts/preflight/validate_pr02_contracts.py"
      - ".github/workflows/preflight-contracts.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Validate PR-02 executable contracts
        run: python scripts/preflight/validate_pr02_contracts.py
