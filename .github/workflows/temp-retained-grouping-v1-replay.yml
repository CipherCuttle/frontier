name: temp-retained-grouping-v1-replay

on:
  push:
    branches:
      - feature/grouping-scalability-v1

permissions:
  contents: read

jobs:
  retained-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/grouping-scalability-v1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.12.10'
          enable-cache: true
      - name: Verify frozen lock
        run: uv lock --check
      - name: Sync frozen environment
        run: uv sync --all-extras --frozen
      - name: Replay retained PEF V0 oracle artifacts through V1
        env:
          GROUPING_REPLAY_URL: https://br-calm-queen-b1ppga6i-groupingreplay.compute.c-5.eu-central-1.aws.neon.tech/grouping-inputs
        run: |
          uv run python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime

          from frontier.domain.grouping import GroupingInput
          from frontier.domain.grouping_v1 import build_compact_grouping_projection

          # These exact membership partitions were derived directly from the
          # persisted baseline_intelligence_snapshots produced by the frozen
          # guarded-hybrid-v0 oracle at the 11 retained successful PEF_V0
          # boundaries. The V1 authority explicitly permits consuming expected
          # artifacts first produced by the pinned implementation and bound by digest.
          expected = {
              '2026-09-08T15:00:00+00:00': (756, 899, '2b5e2fede9323e7b5bcc4110e97c6c5b5b0602bbd38c8ff09c01e2deefec67b4'),
              '2026-09-08T15:05:00+00:00': (986, 1129, '7aa46e3b075d6c57e57977833be51db6c3b8cea4c61373d0bfdf9486d0a18bca'),
              '2026-09-08T15:10:00+00:00': (986, 1129, '7aa46e3b075d6c57e57977833be51db6c3b8cea4c61373d0bfdf9486d0a18bca'),
              '2026-09-08T15:15:00+00:00': (1039, 1182, '81fbd1fb7e4f67753e9d95c957b3f871d9efcf3baf945615c4121dd64d351381'),
              '2026-09-08T15:20:00+00:00': (1099, 1242, 'fad7558cc0f8f7922c584c8cd647dcabe1fbbdea64640739e2551e1e6134e44d'),
              '2026-09-08T15:25:00+00:00': (1271, 1421, 'a0a7ad3fb6f3b31b35bbf394cccb7de8a9ce93d2e0db62f267067f8e1707807b'),
              '2026-09-08T15:30:00+00:00': (1274, 1424, '2d47b2ebccb0fbbdfe30cc0938e30755ee0e16013d0edf3f60cdba88a8c66f35'),
              '2026-09-08T15:35:00+00:00': (1375, 1525, 'd60d43a06258d3f113c0d58891ecf4ef7aec9f7d41f4c0656ac9706bfdb2a6a2'),
              '2026-09-08T15:40:00+00:00': (1498, 1657, '211b2687ba0d3daadc2b070ebfc60aedd49da948e49da645e334224c9f6a8036'),
              '2026-09-08T15:45:00+00:00': (1520, 1679, '9c1e985af044a7a68276b31a1d860107c016019679f3d815a3aebc935f88595f'),
              '2026-09-08T15:50:00+00:00': (1520, 1679, '9c1e985af044a7a68276b31a1d860107c016019679f3d815a3aebc935f88595f'),
          }

          rows: list[dict[str, object]] = []
          for page in range(4):
              url = f"{os.environ['GROUPING_REPLAY_URL']}?page={page}"
              payload = None
              for attempt in range(1, 4):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={'Accept': 'application/json', 'User-Agent': 'frontier-grouping-v1-replay/1'},
                      )
                      with urllib.request.urlopen(request, timeout=60) as response:
                          payload = json.load(response)
                      break
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(2 * attempt)
              assert isinstance(payload, dict), type(payload)
              assert payload.get('page') == page, payload
              page_rows = payload.get('rows')
              assert isinstance(page_rows, list), type(page_rows)
              rows.extend(page_rows)

          assert len(rows) == 1679, len(rows)
          assert len({str(row['observation_id']) for row in rows}) == 1679

          def roles(value: object) -> tuple[str, ...]:
              if value is None:
                  return ()
              if isinstance(value, list):
                  return tuple(str(role) for role in value)
              if isinstance(value, str):
                  raw = value.strip()
                  if raw.startswith('{') and raw.endswith('}'):
                      raw = raw[1:-1]
                  if not raw:
                      return ()
                  return tuple(part.strip().strip('"') for part in raw.split(',') if part.strip())
              raise TypeError(type(value))

          def opt_str(value: object) -> str | None:
              return value if isinstance(value, str) else None

          inputs = tuple(
              GroupingInput(
                  observation_id=str(row['observation_id']),
                  source_id=str(row['source_id']),
                  source_item_key=str(row['source_item_key']),
                  kind=str(row['kind']),
                  observed_at=datetime.fromisoformat(str(row['observed_at']).replace('Z', '+00:00')),
                  canonical_url=opt_str(row.get('canonical_url')),
                  title=opt_str(row.get('title')),
                  text=opt_str(row.get('text')),
                  artifact_type=opt_str(row.get('artifact_type')),
                  artifact_name=opt_str(row.get('artifact_name')),
                  artifact_version=opt_str(row.get('artifact_version')),
                  signal_roles=roles(row.get('signal_roles')),
              )
              for row in rows
          )

          def partition(projection: object) -> tuple[int, str]:
              memberships = [','.join(sorted(group.observation_ids)) for group in projection.groups]
              memberships.extend(projection.ungrouped_observation_ids)
              partition_text = '|'.join(sorted(memberships))
              return len(memberships), hashlib.sha256(partition_text.encode('utf-8')).hexdigest()

          for boundary_text, (expected_episode_count, expected_observation_count, expected_digest) in expected.items():
              as_of = datetime.fromisoformat(boundary_text)
              candidate = build_compact_grouping_projection(inputs, relations=(), as_of=as_of)
              episode_count, digest = partition(candidate)
              result = {
                  'as_of': boundary_text,
                  'episode_count': episode_count,
                  'observation_count': candidate.eligible_observation_count,
                  'partition_sha256': digest,
                  'candidate_pair_count': candidate.candidate_pair_count,
                  'group_pair_count': candidate.group_pair_count,
                  'implementation': 'V1',
              }
              print(json.dumps(result, sort_keys=True))
              assert episode_count == expected_episode_count, result
              assert candidate.eligible_observation_count == expected_observation_count, result
              assert digest == expected_digest, result

          print('retained-grouping-v1-replay: PASS 11/11 exact V1 membership partitions against persisted frozen-V0 oracle artifacts')
          PY
