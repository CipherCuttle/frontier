name: pef-v0-publication-binding-temp-20260908

on:
  push:
    branches:
      - "agent/pef-v0-publication-binding-temp-20260908"
    paths:
      - ".github/workflows/pef-v0-publication-binding-temp-20260908.yml"

permissions:
  contents: read

jobs:
  bind-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact publication merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: db206cda7eed92b62c706a10089c2571b4381d66
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Verify frozen lock and sync
        run: |
          uv lock --check
          uv sync --all-extras --frozen
      - name: Assert exact canonical publication identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "db206cda7eed92b62c706a10089c2571b4381d66"
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "db206cda7eed92b62c706a10089c2571b4381d66"
          test "$(git rev-parse HEAD^1)" = "b1a5f198420614da6ba7eb4d34838be0e0efd1a5"
          test "$(git rev-parse HEAD^2)" = "0b383638853853c12ceded0c0691435870620556"
          test "$(git diff --name-only HEAD^1 HEAD)" = "experiments/advanced_intelligence/pef_v0/candidate_freeze_receipt_v2.json"
      - name: Generate fresh ephemeral transport key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/frontier-publication-private.pem 2>/dev/null
          openssl pkey -in /tmp/frontier-publication-private.pem -pubout -out frontier-publication-public.pem 2>/dev/null
          chmod 600 /tmp/frontier-publication-private.pem
      - name: Upload transport public key
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontier-publication-transport-public-key-20260908
          path: frontier-publication-public.pem
          if-no-files-found: error
          retention-days: 1
      - name: Wait for encrypted canonical database URL
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/CipherCuttle/frontier/agent/pef-v0-publication-binding-temp-20260908/.github/tmp/frontier-publication-db-url.enc.b64"
          for _ in $(seq 1 120); do
            if curl -fsSL "$url" -o /tmp/frontier-publication-db-url.enc.b64; then
              break
            fi
            sleep 5
          done
          test -s /tmp/frontier-publication-db-url.enc.b64
          base64 -d /tmp/frontier-publication-db-url.enc.b64 > /tmp/frontier-publication-db-url.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/frontier-publication-private.pem \
            -in /tmp/frontier-publication-db-url.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/frontier-publication-db-url
          test -s /tmp/frontier-publication-db-url
      - name: Verify and persist exact GitHub main publication binding
        shell: bash
        run: |
          set -euo pipefail
          FRONTIER_DATABASE_URL="$(cat /tmp/frontier-publication-db-url)"
          echo "::add-mask::$FRONTIER_DATABASE_URL"
          export FRONTIER_DATABASE_URL
          uv run frontier doctor > /tmp/frontier-publication-doctor.json
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "db206cda7eed92b62c706a10089c2571b4381d66"
          FRONTIER_FREEZE_PUBLICATION_PERSIST_AUTHORIZED=1 uv run frontier freeze publish \
            --receipt-id freezereceipt_d8ea34d4f5ae84d7eb1de30272395876823c55287b8900af7ba8abadfc5c2346 \
            --root . > /tmp/frontier-publication-binding.json
          python -m json.tool /tmp/frontier-publication-binding.json >/dev/null
          rm -f /tmp/frontier-publication-db-url /tmp/frontier-publication-db-url.enc /tmp/frontier-publication-db-url.enc.b64 /tmp/frontier-publication-private.pem
      - name: Upload publication binding receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pef-v0-publication-binding-v2
          path: /tmp/frontier-publication-binding.json
          if-no-files-found: error
          retention-days: 1
