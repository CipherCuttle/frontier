name: G2-02 publication fixture-seam removal temp

on:
  push:
    branches:
      - agent/g202-publication-authority-repair2-temp

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: frontier
          POSTGRES_PASSWORD: frontier
          POSTGRES_DB: frontier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frontier -d frontier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BASE_SHA: 18d1df9579fa03c9edd62e6df654cb6e965f375b
      TARGET_SHA: 332b9927613566e78d987278c0f6f6e4d77cd3d1
      TARGET_BRANCH: agent/gigasprint-02-prefreeze-launch-integrity
      CANDIDATE_BRANCH: agent/g202-publication-authority-candidate2
      FRONTIER_TEST_DATABASE_URL: postgresql://frontier:frontier@localhost:5432/frontier
      FRONTIER_DATABASE_URL: postgresql+psycopg://frontier:frontier@localhost:5432/frontier
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - name: Remove production fixture seam
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_SHA"
          git checkout --detach "$BASE_SHA"
          uv run python - <<'PY'
          from pathlib import Path
          import re

          adapter = Path("src/frontier/adapters/postgres/freeze_publication.py")
          text = adapter.read_text(encoding="utf-8")
          text = text.replace(
              '            "use record_verified_publication or the explicit fixture seam"\n',
              '            "use record_verified_publication"\n',
              1,
          )
          old = '''        publication = derive_github_main_freeze_publication(\n            root, receipt, receipt_path=receipt_path\n        )\n        self._record(publication)\n        return publication\n\n    def record_fixture_publication(self, publication: CandidateFreezePublication) -> None:\n        """Explicit test/fixture seam; never use for operator publication."""\n        if not self._persistence_authorized:\n            raise PermissionError("candidate freeze publication persistence is not authorized")\n        self._record(publication)\n\n    def _record(self, publication: CandidateFreezePublication) -> None:\n        with self._connection.transaction(), self._connection.cursor() as cur:\n'''
          new = '''        publication = derive_github_main_freeze_publication(\n            root, receipt, receipt_path=receipt_path\n        )\n        with self._connection.transaction(), self._connection.cursor() as cur:\n'''
          if text.count(old) != 1:
              raise SystemExit("production fixture seam block not found exactly once")
          text = text.replace(old, new, 1)
          marker = '''                if row is None or cast(str, row[0]) != str(publication.publication_digest):\n                    raise RuntimeError("freeze publication identity conflict")\n\n    def get_publication'''
          replacement = '''                if row is None or cast(str, row[0]) != str(publication.publication_digest):\n                    raise RuntimeError("freeze publication identity conflict")\n        return publication\n\n    def get_publication'''
          if text.count(marker) != 1:
              raise SystemExit("verified publication return insertion point not found")
          adapter.write_text(text.replace(marker, replacement, 1), encoding="utf-8")

          helper = Path("tests/integration/freeze_publication_fixture.py")
          helper.write_text('''"""Test-only synthetic freeze-publication persistence helper.\n\nThis module is outside ``src/frontier`` and is not packaged with the product.\nProduction publication persistence must pass GitHub-main verification.\n"""\n\nfrom __future__ import annotations\n\nfrom typing import cast\n\nfrom psycopg import Connection\nfrom psycopg.types.json import Jsonb\n\nfrom frontier.application.freeze_publication import CandidateFreezePublication\n\n\ndef record_fixture_publication(\n    connection: Connection[tuple[object, ...]], publication: CandidateFreezePublication\n) -> None:\n    with connection.transaction(), connection.cursor() as cur:\n        cur.execute(\n            """INSERT INTO candidate_freeze_publications (\n                receipt_id, schema_version, freeze_receipt_digest, implementation_commit,\n                implementation_tree_digest, publication_commit, publication_committer_at,\n                publication_digest, publication_json\n            ) VALUES (%s,%s,%s,%s,%s,%s,%s,%s,%s)\n            ON CONFLICT (receipt_id) DO NOTHING RETURNING receipt_id""",\n            (\n                publication.freeze_receipt_id,\n                publication.schema_version,\n                str(publication.freeze_receipt_digest),\n                publication.implementation_commit,\n                publication.implementation_tree_digest,\n                publication.publication_commit,\n                publication.publication_committer_at,\n                str(publication.publication_digest),\n                Jsonb(publication.to_canonical()),\n            ),\n        )\n        inserted = cur.fetchone()\n        if inserted is None:\n            cur.execute(\n                "SELECT publication_digest FROM candidate_freeze_publications WHERE receipt_id=%s",\n                (publication.freeze_receipt_id,),\n            )\n            row = cur.fetchone()\n            if row is None or cast(str, row[0]) != str(publication.publication_digest):\n                raise RuntimeError("fixture freeze publication identity conflict")\n''', encoding="utf-8")

          matched: list[str] = []
          pattern = re.compile(
              r"PostgresCandidateFreezePublicationRepository\(\s*conn,\s*"
              r"persistence_authorized=True\s*\)\.record_fixture_publication\("
          )
          for path in sorted(Path("tests/integration").glob("test_*.py")):
              source = path.read_text(encoding="utf-8")
              if ".record_fixture_publication(" not in source:
                  continue
              source, count = pattern.subn("record_fixture_publication(conn, ", source)
              if count != 1:
                  raise SystemExit(f"{path}: expected one fixture publication call, got {count}")
              insertion = "from tests.integration.freeze_publication_fixture import record_fixture_publication\n\n"
              first_frontier = source.find("from frontier.")
              if first_frontier < 0:
                  raise SystemExit(f"{path}: no frontier import anchor")
              source = source[:first_frontier] + insertion + source[first_frontier:]
              path.write_text(source, encoding="utf-8")
              matched.append(path.as_posix())
          if len(matched) != 5:
              raise SystemExit(f"expected five fixture consumers, found {matched}")
          print("fixture consumers:", *matched, sep="\n")
          PY
          test "$(grep -R 'record_fixture_publication' src/frontier --include='*.py' | wc -l)" -eq 0
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            case "$path" in
              src/frontier/adapters/postgres/freeze_publication.py|tests/integration/freeze_publication_fixture.py|tests/integration/test_*.py) ;;
              *) echo "unexpected second-repair path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
      - name: Verify final authority repair
        shell: bash
        run: |
          set -euo pipefail
          uv sync --all-extras --frozen
          mapfile -t pyfiles < <(git diff --name-only -- '*.py')
          uv run ruff check --fix "${pyfiles[@]}"
          uv run ruff format "${pyfiles[@]}"
          uv run ruff check "${pyfiles[@]}"
          uv run pyright
          uv run alembic upgrade head
          uv run pytest -q \
            tests/unit/test_freeze_publication.py \
            tests/unit/test_freeze_cli.py \
            tests/unit/test_drift_sentry.py \
            tests/integration/test_freeze_publication_postgres.py \
            tests/integration/test_confirmatory_claim_postgres.py \
            tests/integration/test_freeze_workflow_postgres.py \
            tests/integration/test_drift_sentry_postgres.py \
            tests/integration/test_evaluation_persisted_postgres.py \
            tests/integration/test_experiment_lifecycle_postgres.py
          git diff --check
          test "$(grep -R 'record_fixture_publication' src/frontier --include='*.py' | wc -l)" -eq 0
          test "$(grep -R 'def _record(' src/frontier/adapters/postgres/freeze_publication.py | wc -l)" -eq 0
          test "$(grep -R '\.record_publication(' tests --include='*.py' | wc -l)" -eq 1
      - name: Materialize final product candidate
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontier/adapters/postgres/freeze_publication.py tests/integration
          git commit -m "fix(gigasprint02): remove unchecked publication fixture seam"
          git push origin HEAD:"refs/heads/$CANDIDATE_BRANCH"
