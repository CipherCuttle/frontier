name: tmp-evidence-query-regenerate

on:
  push:
    branches:
      - feature/post-pef-v0-evidence-query-v0
    paths:
      - .github/workflows/tmp-evidence-query-regenerate.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/post-pef-v0-evidence-query-v0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --frozen
      - run: uv run python scripts/generate_public_contracts.py
      - name: Assert OpenAPI is unchanged by generator repair
        run: git diff --exit-code -- contracts/public/openapi_v0.json
      - name: Commit regenerated TypeScript client
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients/typescript/src/generated/public_read_v0.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore(contracts): regenerate public TypeScript client"
          git push origin HEAD:feature/post-pef-v0-evidence-query-v0
