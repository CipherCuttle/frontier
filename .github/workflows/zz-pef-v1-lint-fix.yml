name: bounded-pef-v1-lint-fix

on:
  push:
    branches:
      - feature/pef-v1-confirmatory-orchestration

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pef-v1-confirmatory-orchestration
          fetch-depth: 0
      - name: Remove stale import and self-delete
        shell: bash
        run: |
          sed -i '/^    PefV1ConfirmatoryEvidence,$/d' tests/integration/test_pef_v1_confirmatory_postgres.py
          git rm .github/workflows/zz-pef-v1-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/test_pef_v1_confirmatory_postgres.py
          git commit -m "fix(pef-v1): remove stale test import"
          git push origin HEAD:feature/pef-v1-confirmatory-orchestration
