name: tmp-pef-grouping-memory
on:
  push:
    branches:
      - ops/pef-v0-confirmatory-incident-repair-20260908
    paths:
      - .github/workflows/tmp-pef-grouping-memory.yml
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --frozen
      - name: Benchmark exact frozen baseline digest shape
        shell: bash
        run: |
          /usr/bin/time -v uv run python - <<'PY'
          from datetime import UTC, datetime
          from frontier.domain.grouping import GroupingInput, build_grouping_projection
          from frontier.domain.intelligence import BaselineObservationInput, baseline_input_digest

          n = 2425
          now = datetime(2026, 9, 8, 19, 40, tzinfo=UTC)
          items = tuple(
              GroupingInput(
                  observation_id=f"obs_{i:064x}",
                  source_id="hn.frontpage",
                  source_item_key=f"item-{i}",
                  kind="EVENT",
                  observed_at=now,
                  canonical_url=None,
                  title=f"uniquealpha{i} uniquebeta{i} uniquegamma{i}",
                  text=f"uniquetext{i}",
                  signal_roles=("PRIMARY",),
              )
              for i in range(n)
          )
          observations = tuple(
              BaselineObservationInput(
                  grouping=item,
                  first_reason="SCHEDULED",
                  recovered_after_gap=False,
              )
              for item in items
          )
          projection = build_grouping_projection(items, as_of=now)
          print("n=", n, flush=True)
          print("pairs=", n * (n - 1) // 2, flush=True)
          print("ambiguous=", len(projection.ambiguous_pairs), flush=True)
          digest = baseline_input_digest(
              observations,
              grouping_projection=projection,
              enabled_source_ids=("hn.frontpage",),
              health=(),
          )
          print("digest=", digest, flush=True)
          PY
