name: temp-repair-grouping-v1-private-helper

on:
  push:
    branches: [feature/grouping-scalability-v1]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/grouping-scalability-v1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
      - name: Sync frozen environment
        run: uv sync --all-extras --frozen
      - name: Replace private V0 helper dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/frontier/domain/grouping_v1.py")
          text = path.read_text()
          text = text.replace("    _explicit_pairs,\n", "")
          marker = '''def build_compact_grouping_projection(
          '''
          helper = '''def _explicit_pairs_v1(
              relations: Iterable[GroupingRelationInput],
              *,
              as_of: datetime,
              allowed_ids: frozenset[str],
          ) -> frozenset[tuple[str, str]]:
              pairs: set[tuple[str, str]] = set()
              for relation in relations:
                  if relation.created_at > as_of:
                      continue
                  if relation.authority != "EXPLICIT":
                      continue
                  if relation.relation_type not in {"CORRECTS", "RETRACTS"}:
                      continue
                  if (
                      relation.from_observation_id not in allowed_ids
                      or relation.target_observation_id not in allowed_ids
                  ):
                      continue
                  pairs.add(
                      ordered_pair(
                          relation.from_observation_id,
                          relation.target_observation_id,
                      )
                  )
              return frozenset(pairs)


          '''
          if marker not in text:
              raise SystemExit("build marker not found")
          if "def _explicit_pairs_v1(" not in text:
              text = text.replace(marker, helper + marker, 1)
          text = text.replace("explicit_pairs = _explicit_pairs(\n", "explicit_pairs = _explicit_pairs_v1(\n")
          path.write_text(text)
          PY
          uv run ruff format src/frontier/domain/grouping_v1.py
          uv run ruff check src/frontier/domain/grouping_v1.py
          uv run pyright src/frontier/domain/grouping_v1.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontier/domain/grouping_v1.py
          git commit -m "fix(grouping): keep V0 relation filtering local to V1"
          git push origin HEAD:feature/grouping-scalability-v1
