name: temp-repair-grouping-v1-test-import

on:
  push:
    branches:
      - feature/grouping-scalability-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/grouping-scalability-v1
      - name: Repair sibling test import without package marker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/unit/test_grouping_scalability_v1.py')
          text = path.read_text()
          old = 'from tests.unit.test_grouping_baseline import corpus_cases'
          new = 'from test_grouping_baseline import corpus_cases'
          if old not in text:
              raise SystemExit('expected import not found')
          path.write_text(text.replace(old, new, 1))
          Path('tests/unit/__init__.py').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/unit/test_grouping_scalability_v1.py tests/unit/__init__.py
          git commit -m 'test(grouping): avoid package-scoped sibling import'
          git push origin HEAD:feature/grouping-scalability-v1
