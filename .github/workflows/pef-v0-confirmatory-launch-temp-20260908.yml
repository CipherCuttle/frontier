name: pef-v0-confirmatory-launch-temp-20260908

on:
  push:
    branches:
      - agent/pef-v0-confirmatory-launch-temp-20260908
    paths-ignore:
      - '.github/tmp/**'

permissions:
  contents: read

env:
  CANONICAL_PUBLICATION_COMMIT: db206cda7eed92b62c706a10089c2571b4381d66
  CANONICAL_PUBLICATION_TREE: 5134857849b03c0dcff4595c8c9fe1059ffe47a6
  EXPECTED_FREEZE_RECEIPT_ID: freezereceipt_d8ea34d4f5ae84d7eb1de30272395876823c55287b8900af7ba8abadfc5c2346
  EXPECTED_PUBLICATION_COMMIT: db206cda7eed92b62c706a10089c2571b4381d66
  TRANSPORT_BRANCH: agent/pef-v0-confirmatory-launch-temp-20260908
  TRANSPORT_PATH: .github/tmp/frontier-confirmatory-db-url-v3.enc.b64

jobs:
  confirmatory-first-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact canonical publication
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANONICAL_PUBLICATION_COMMIT }}
          fetch-depth: 0

      - name: Assert exact canonical publication identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_PUBLICATION_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANONICAL_PUBLICATION_TREE"
          test "$(git rev-parse HEAD^1)" = "b1a5f198420614da6ba7eb4d34838be0e0efd1a5"
          test "$(git rev-parse HEAD^2)" = "0b383638853853c12ceded0c0691435870620556"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Verify frozen lock and sync
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --all-extras --frozen

      - name: Generate fresh ephemeral transport key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frontier-confirmatory-transport"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 \
            -out "$RUNNER_TEMP/frontier-confirmatory-transport/private.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/frontier-confirmatory-transport/private.pem" \
            -pubout -out "$RUNNER_TEMP/frontier-confirmatory-transport/public.pem" >/dev/null 2>&1

      - name: Upload transport public key
        uses: actions/upload-artifact@v4
        with:
          name: frontier-confirmatory-transport-public-key-20260908-v3
          path: ${{ runner.temp }}/frontier-confirmatory-transport/public.pem
          retention-days: 1
          if-no-files-found: error

      - name: Wait for encrypted canonical database URL
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${TRANSPORT_PATH}?ref=${TRANSPORT_BRANCH}"
          json="$RUNNER_TEMP/frontier-confirmatory-transport/db.content.json"
          out="$RUNNER_TEMP/frontier-confirmatory-transport/db.enc.b64"
          for _ in $(seq 1 120); do
            code="$(curl -sS -L -o "$json.tmp" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" || true)"
            if [ "$code" = "200" ]; then
              mv "$json.tmp" "$json"
              jq -r '.content' "$json" | tr -d '\n' | base64 -d > "$out"
              break
            fi
            rm -f "$json.tmp"
            sleep 2
          done
          test -s "$out"
          base64 -d "$out" > "$RUNNER_TEMP/frontier-confirmatory-transport/db.enc"
          openssl pkeyutl -decrypt \
            -inkey "$RUNNER_TEMP/frontier-confirmatory-transport/private.pem" \
            -in "$RUNNER_TEMP/frontier-confirmatory-transport/db.enc" \
            -out "$RUNNER_TEMP/frontier-confirmatory-transport/db.url" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          test -s "$RUNNER_TEMP/frontier-confirmatory-transport/db.url"

      - name: Run one canonical acquisition plus CONFIRMATORY boundary
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(cat "$RUNNER_TEMP/frontier-confirmatory-transport/db.url")"
          FRONTIER_DATABASE_URL="$DB_URL" uv run python - <<'PY' | tee "$RUNNER_TEMP/pef-v0-confirmatory-first-boundary.json"
          from __future__ import annotations

          import asyncio
          import json
          import os
          from pathlib import Path

          import psycopg

          from frontier.adapters.acquisition.config import load_fetch_policy, load_source_registry
          from frontier.adapters.acquisition.fetcher import SecureHttpFetcher
          from frontier.adapters.postgres import PostgresEvidenceStore
          from frontier.adapters.postgres.experiment_attempts import (
              PostgresExperimentAttemptRepository,
              PostgresFreezeBindingResolver,
              PostgresShadowRunPersister,
          )
          from frontier.adapters.postgres.frozen_registry_intelligence import (
              PostgresFrozenRegistryBaselineIntelligenceRepository,
          )
          from frontier.adapters.postgres.readiness import verify_database_readiness
          from frontier.adapters.postgres.worker_ops import PostgresWorkerLease
          from frontier.application.acquisition import AcquisitionService
          from frontier.application.drift_sentry import DriftSentry
          from frontier.application.experiment_orchestration import (
              RUN_CLASS_CONFIRMATORY,
              ExperimentCycleAction,
              ExperimentOrchestrator,
          )
          from frontier.application.worker import AcquisitionWorker

          root = Path('.')
          database_url = os.environ['FRONTIER_DATABASE_URL']
          expected_receipt = os.environ['EXPECTED_FREEZE_RECEIPT_ID']
          expected_publication = os.environ['EXPECTED_PUBLICATION_COMMIT']
          worker_id = 'frontier-confirmatory-launch-20260908-v3'

          policy = load_fetch_policy(root)
          registry = load_source_registry(root)
          fetcher = SecureHttpFetcher(policy)

          with psycopg.connect(database_url) as conn:
              verify_database_readiness(conn)
              store = PostgresEvidenceStore(conn)
              resolver = PostgresFreezeBindingResolver(conn)
              binding = resolver.latest_binding()
              if binding is None:
                  raise RuntimeError('no canonical freeze binding is resolvable')
              if binding.receipt.receipt_id != expected_receipt:
                  raise RuntimeError(
                      f'latest freeze receipt mismatch: {binding.receipt.receipt_id} != {expected_receipt}'
                  )
              if binding.publication_commit != expected_publication:
                  raise RuntimeError(
                      f'publication commit mismatch: {binding.publication_commit} != {expected_publication}'
                  )
              if binding.durable_freeze_at is None or binding.publication_committer_at is None:
                  raise RuntimeError('freeze durability/publication binding is incomplete')

              service = AcquisitionService(
                  registry=registry,
                  policy=policy,
                  fetcher=fetcher,
                  repository=store,
              )
              orchestrator = ExperimentOrchestrator(
                  attempts=PostgresExperimentAttemptRepository(conn),
                  baseline_repository=PostgresFrozenRegistryBaselineIntelligenceRepository(
                      conn, registry
                  ),
                  persistence=PostgresShadowRunPersister(conn),
                  source_registry_version=registry.source_registry_version,
                  freeze_binding=resolver,
                  run_class=RUN_CLASS_CONFIRMATORY,
                  canonical_context=True,
                  drift_sentry=DriftSentry(root),
                  worker_id=worker_id,
              )
              worker = AcquisitionWorker(
                  registry=registry,
                  repository=store,
                  service=service,
                  worker_id=worker_id,
                  lease=PostgresWorkerLease(conn),
                  experiment_orchestrator=orchestrator,
                  is_transient_connection_error=lambda error: isinstance(
                      error, psycopg.OperationalError
                  ),
              )
              cycle = asyncio.run(worker.run_once())
              experiment = cycle.experiment
              if experiment is None:
                  raise RuntimeError('confirmatory orchestrator produced no experiment result')
              if experiment.action is not ExperimentCycleAction.RAN:
                  raise RuntimeError(
                      f'first confirmatory boundary was not admitted: {experiment.action.value}'
                  )
              if experiment.run_id is None:
                  raise RuntimeError('admitted confirmatory boundary has no run_id')

              payload = {
                  'worker_id': worker_id,
                  'run_class': RUN_CLASS_CONFIRMATORY,
                  'freeze_receipt_id': binding.receipt.receipt_id,
                  'publication_commit': binding.publication_commit,
                  'publication_committer_at': binding.publication_committer_at.isoformat(),
                  'durable_freeze_at': binding.durable_freeze_at.isoformat(),
                  'source_registry_version': str(registry.source_registry_version),
                  'cycle_started_at': cycle.started_at.isoformat(),
                  'cycle_completed_at': cycle.completed_at.isoformat(),
                  'acquired': [
                      {
                          'source_id': result.source_id,
                          'status': result.status.value,
                          'inserted': result.inserted,
                          'duplicates': result.duplicates,
                          'rejected': result.rejected,
                          'failure_code': result.failure_code,
                      }
                      for result in cycle.acquired
                  ],
                  'isolated_errors': [
                      {'source_id': source_id, 'error': error}
                      for source_id, error in cycle.errors
                  ],
                  'experiment': {
                      'action': experiment.action.value,
                      'boundary': experiment.boundary.isoformat(),
                      'attempt_status': (
                          None if experiment.attempt is None else experiment.attempt.status.value
                      ),
                      'run_id': experiment.run_id,
                  },
              }
              print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload canonical first-boundary receipt
        uses: actions/upload-artifact@v4
        with:
          name: pef-v0-confirmatory-first-boundary-20260908-v3
          path: ${{ runner.temp }}/pef-v0-confirmatory-first-boundary.json
          retention-days: 7
          if-no-files-found: error
