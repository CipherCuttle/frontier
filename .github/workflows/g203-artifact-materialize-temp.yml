name: G2-03 artifact materialize temp

on:
  push:
    branches:
      - agent/g203-artifact-materialize-temp

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download verified G2-03 artifact
        uses: actions/download-artifact@v4
        with:
          name: g203-verified-bytes
          path: /tmp/g203
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34168874086
      - name: Verify and materialize exact test blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object /tmp/g203/src/frontier/application/evaluation.py)" = "532cbd126f0ab18a38304c24206311a6a9d52887"
          test "$(git hash-object /tmp/g203/src/frontier/application/evaluation_loaders.py)" = "a64e12196af59a53b23fe84974db674b6f4e67fd"
          test "$(git hash-object /tmp/g203/src/frontier/adapters/postgres/evaluation_store.py)" = "9e0b68e1c6b8493bcd0d8a3901063b1056e70c14"
          test "$(git hash-object /tmp/g203/tests/unit/test_evaluation_loaders.py)" = "4f4758517c07a3fb3c66dc01cc1e2e0a9818797b"
          test "$(git hash-object /tmp/g203/tests/integration/test_evaluation_persisted_postgres.py)" = "d5bfeb60cb8d88e8cafa1e7fbcc0adffed810576"
          test "$(git hash-object /tmp/g203/tests/replay/test_experiment_gauntlet.py)" = "1f4addf07b383a68e9fc56df02eeb3e253312547"
          cp /tmp/g203/tests/unit/test_evaluation_loaders.py tests/unit/test_evaluation_loaders.py
          cp /tmp/g203/tests/replay/test_experiment_gauntlet.py tests/replay/test_experiment_gauntlet.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/unit/test_evaluation_loaders.py tests/replay/test_experiment_gauntlet.py
          git commit -m "chore: materialize exact G2-03 artifact blobs [skip ci]"
          git push origin HEAD:agent/g203-artifact-materialize-temp
