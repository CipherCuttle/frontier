name: e2e-postgres

on:
  pull_request:
    paths:
      - "src/frontier/**"
      - "migrations/**"
      - "tests/**"
      - "scripts/ops/**"
      - ".github/workflows/e2e-postgres.yml"
  schedule:
    # Nightly: full live-PostgreSQL proof even when nothing changed.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: frontier
          POSTGRES_PASSWORD: frontier
          POSTGRES_DB: frontier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frontier -d frontier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FRONTIER_E2E_DATABASE_URL: postgresql://frontier:frontier@localhost:5432/frontier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Verify frozen lock
        run: uv lock --check
      - name: Sync frozen environment
        run: uv sync --all-extras --frozen
      - name: Full experiment lifecycle proof on live PostgreSQL
        run: uv run pytest -q tests/integration/test_experiment_lifecycle_postgres.py
      - name: Verify generated client contract types still match
        run: uv run python scripts/generate_public_contracts.py --check
      - name: WP10 backup and restore recovery drill
        env:
          FRONTIER_RECOVERY_DATABASE_URL: postgresql://frontier:frontier@localhost:5432/frontier
          FRONTIER_RECOVERY_DRILL_ALLOW: "1"
        run: uv run python scripts/ops/verify_backup_restore.py

  integration-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: frontier
          POSTGRES_PASSWORD: frontier
          POSTGRES_DB: frontier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frontier -d frontier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Makes the lifecycle E2E file (which manages its own scratch database)
      # runnable inside the per-file loop as well.
      FRONTIER_E2E_DATABASE_URL: postgresql://frontier:frontier@localhost:5432/frontier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Run every DB-bound test file on its own fresh database
        run: |
          set -uo pipefail
          status=0
          admin_env=(-e PGPASSWORD=frontier)
          psql_cmd=(docker run --rm --network host "${admin_env[@]}" postgres:18 psql -h localhost -p 5432 -U frontier -d postgres -v ON_ERROR_STOP=1)
          for file in tests/integration/test_*.py tests/replay/test_experiment_gauntlet_postgres.py; do
            # The known pre-existing cross-test pollution on one shared
            # database (fixed-item-key fixtures) is bypassed by fresh-database
            # isolation: every file runs once against a dedicated scratch
            # database that is migrated, used and destroyed.
            db="frontier_it_$(echo "$file" | md5sum | cut -c1-8)"
            scratch_url="postgresql://frontier:frontier@localhost:5432/$db"
            sqlalchemy_url="postgresql+psycopg://frontier:frontier@localhost:5432/$db"
            "${psql_cmd[@]}" -c "DROP DATABASE IF EXISTS \"$db\" WITH (FORCE)" \
              -c "CREATE DATABASE \"$db\""
            FRONTIER_DATABASE_URL="$sqlalchemy_url" uv run alembic upgrade head
            echo "::group::$file"
            FRONTIER_TEST_DATABASE_URL="$scratch_url" uv run pytest -q "$file" || status=1
            echo "::endgroup::"
            docker run --rm --network host -e PGPASSWORD=frontier postgres:18 psql \
              -h localhost -p 5432 -U frontier -d postgres \
              -c "DROP DATABASE IF EXISTS \"$db\" WITH (FORCE)"
          done
          exit "$status"
