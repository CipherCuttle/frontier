name: pef-v0-real-freeze-operator-temp

on:
  push:
    branches:
      - "agent/pef-v0-real-freeze-operator-temp"

permissions:
  contents: read

jobs:
  offline-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact canonical implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: d106f66580b4b843e086f9c833daff10aec8fdda
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Verify frozen lock and sync
        run: |
          uv lock --check
          uv sync --all-extras --frozen
      - name: Assert exact canonical identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d106f66580b4b843e086f9c833daff10aec8fdda"
          test "$(git rev-parse 'HEAD^{tree}')" = "807c0157219c8075874053357def5a0ad658b0c0"
      - name: Generate canonical Alembic offline SQL
        shell: bash
        run: |
          set -euo pipefail
          FRONTIER_DATABASE_URL='postgresql+psycopg://offline:offline@localhost/offline' uv run alembic upgrade head --sql > frontier-schema.sql
          sha256sum frontier-schema.sql
      - name: Upload canonical schema SQL
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontier-canonical-schema-sql
          path: frontier-schema.sql
          if-no-files-found: error
          retention-days: 1
