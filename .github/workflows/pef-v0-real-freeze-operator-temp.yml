name: pef-v0-real-freeze-operator-temp

on:
  push:
    branches:
      - "agent/pef-v0-real-freeze-operator-temp"
    paths:
      - ".github/workflows/pef-v0-real-freeze-operator-temp.yml"

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact canonical implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: d106f66580b4b843e086f9c833daff10aec8fdda
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Verify frozen lock and sync
        run: |
          uv lock --check
          uv sync --all-extras --frozen
      - name: Assert exact canonical identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d106f66580b4b843e086f9c833daff10aec8fdda"
          test "$(git rev-parse 'HEAD^{tree}')" = "807c0157219c8075874053357def5a0ad658b0c0"
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "d106f66580b4b843e086f9c833daff10aec8fdda"
      - name: Generate ephemeral transport key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/frontier-freeze-private.pem 2>/dev/null
          openssl pkey -in /tmp/frontier-freeze-private.pem -pubout -out frontier-freeze-public.pem 2>/dev/null
          chmod 600 /tmp/frontier-freeze-private.pem
      - name: Upload transport public key
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontier-freeze-transport-public-key
          path: frontier-freeze-public.pem
          if-no-files-found: error
          retention-days: 1
      - name: Wait for encrypted database URL
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/CipherCuttle/frontier/agent/pef-v0-real-freeze-operator-temp/.github/tmp/frontier-freeze-db-url.enc.b64"
          for _ in $(seq 1 120); do
            if curl -fsSL "$url" -o /tmp/frontier-freeze-db-url.enc.b64; then
              break
            fi
            sleep 5
          done
          test -s /tmp/frontier-freeze-db-url.enc.b64
          base64 -d /tmp/frontier-freeze-db-url.enc.b64 > /tmp/frontier-freeze-db-url.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/frontier-freeze-private.pem \
            -in /tmp/frontier-freeze-db-url.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/frontier-freeze-db-url
          test -s /tmp/frontier-freeze-db-url
      - name: Verify Neon readiness and persist replacement freeze
        shell: bash
        run: |
          set -euo pipefail
          FRONTIER_DATABASE_URL="$(cat /tmp/frontier-freeze-db-url)"
          echo "::add-mask::$FRONTIER_DATABASE_URL"
          export FRONTIER_DATABASE_URL
          uv run frontier doctor > /tmp/frontier-doctor.json
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "d106f66580b4b843e086f9c833daff10aec8fdda"
          FRONTIER_FREEZE_PERSIST_AUTHORIZED=1 uv run frontier freeze derive --persist --root . > /tmp/frontier-freeze.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/frontier-freeze.json', encoding='utf-8'))
          assert p['status'] == 'FROZEN', p
          assert p['verify_status'] == 'FROZEN', p
          assert p['persisted'] is True, p
          assert p['durable_freeze_at'], p
          receipt = p['receipt']
          assert receipt['implementation_commit'] == 'd106f66580b4b843e086f9c833daff10aec8fdda', receipt
          assert receipt['implementation_tree_digest'] == '807c0157219c8075874053357def5a0ad658b0c0', receipt
          print(json.dumps({'receipt_id': p['receipt_id'], 'durable_freeze_at': p['durable_freeze_at'], 'status': p['status'], 'verify_status': p['verify_status']}, sort_keys=True))
          PY
          rm -f /tmp/frontier-freeze-db-url /tmp/frontier-freeze-db-url.enc /tmp/frontier-freeze-db-url.enc.b64 /tmp/frontier-freeze-private.pem
      - name: Upload replacement freeze receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pef-v0-replacement-freeze
          path: /tmp/frontier-freeze.json
          if-no-files-found: error
          retention-days: 1
