name: ordinary-prehorizon-snapshot-probe-v0

on:
  workflow_dispatch:
    inputs:
      knowledge_horizon:
        description: "Target UTC knowledge horizon, e.g. 2026-09-14T06:00:00Z"
        required: true
        type: string
      snapshot_id:
        description: "Unique non-scored probe identifier"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/probe-requests/ordinary-prehorizon-v0/*.json"

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Sync frozen environment
        run: uv sync --all-extras --frozen
      - name: Resolve manual non-scored probe request
        id: request
        shell: bash
        env:
          DISPATCH_KNOWLEDGE_HORIZON: ${{ inputs.knowledge_horizon }}
          DISPATCH_SNAPSHOT_ID: ${{ inputs.snapshot_id }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ -z "${DISPATCH_KNOWLEDGE_HORIZON}" || -z "${DISPATCH_SNAPSHOT_ID}" ]]; then
              echo "workflow_dispatch requires knowledge_horizon and snapshot_id" >&2
              exit 1
            fi
            echo "knowledge_horizon=${DISPATCH_KNOWLEDGE_HORIZON}" >> "$GITHUB_OUTPUT"
            echo "snapshot_id=${DISPATCH_SNAPSHOT_ID}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            uv run python -m frontier.application.value_observatory_ordinary_snapshot_trigger \
              --head-sha "$GITHUB_SHA" \
              --github-output "$GITHUB_OUTPUT"
          else
            echo "unsupported ordinary snapshot probe trigger: ${GITHUB_EVENT_NAME}" >&2
            exit 1
          fi
      - name: Run seven-source non-scored probe
        id: produce
        shell: bash
        env:
          KNOWLEDGE_HORIZON: ${{ steps.request.outputs.knowledge_horizon }}
          SNAPSHOT_ID: ${{ steps.request.outputs.snapshot_id }}
        run: |
          set +e
          uv run python scripts/run_ordinary_snapshot_probe_v0.py produce \
            --knowledge-horizon "$KNOWLEDGE_HORIZON" \
            --snapshot-id "$SNAPSHOT_ID" \
            --output-dir probe-output
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Retain failed probe diagnostics
        if: steps.produce.outputs.exit_code != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ordinary-snapshot-probe-failure-${{ steps.request.outputs.snapshot_id }}
          path: probe-output/probe_report_v0.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed on incomplete source set
        if: steps.produce.outputs.exit_code != '0'
        run: exit 1
      - name: Upload immutable snapshot payload
        if: steps.produce.outputs.exit_code == '0'
        id: payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ordinary-snapshot-payload-v0-${{ steps.request.outputs.snapshot_id }}
          path: probe-output/ordinary_snapshot_payload_v0.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Attest uploaded snapshot artifact digest
        if: steps.produce.outputs.exit_code == '0'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ordinary-snapshot-payload-v0-${{ steps.request.outputs.snapshot_id }}
          subject-digest: sha256:${{ steps.payload.outputs.artifact-digest }}
      - name: Retrieve server artifact metadata
        if: steps.produce.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.payload.outputs.artifact-id }}
        run: |
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            > probe-output/artifact_metadata.json
      - name: Create separate post-upload receipt
        if: steps.produce.outputs.exit_code == '0'
        run: |
          uv run python scripts/run_ordinary_snapshot_probe_v0.py receipt \
            --payload probe-output/ordinary_snapshot_payload_v0.json \
            --artifact-metadata probe-output/artifact_metadata.json \
            --expected-artifact-digest '${{ steps.payload.outputs.artifact-digest }}' \
            --attestation-ref '${{ steps.attest.outputs.attestation-url }}' \
            --attestation-bundle '${{ steps.attest.outputs.bundle-path }}' \
            --repository '${{ github.repository }}' \
            --output probe-output/ordinary_snapshot_receipt_v0.json
      - name: Retain receipt and non-scored probe report
        if: steps.produce.outputs.exit_code == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ordinary-snapshot-probe-receipt-${{ steps.request.outputs.snapshot_id }}
          path: |
            probe-output/ordinary_snapshot_receipt_v0.json
            probe-output/probe_report_v0.json
          if-no-files-found: error
          retention-days: 30
