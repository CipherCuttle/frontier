name: d013-boundary-consistency-patch

on:
  push:
    branches: [feature/post-pef-v0-d013-overview-boundary-consistency]
    paths: [.github/workflows/d013-boundary-consistency-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: frontier
          POSTGRES_PASSWORD: frontier
          POSTGRES_DB: frontier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frontier -d frontier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FRONTIER_TEST_DATABASE_URL: postgresql://frontier:frontier@localhost:5432/frontier
      FRONTIER_DATABASE_URL: postgresql+psycopg://frontier:frontier@localhost:5432/frontier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/post-pef-v0-d013-overview-boundary-consistency
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
      - name: Sync frozen environment
        run: uv sync --all-extras --frozen
      - name: Apply exact D013 repair
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          domain = "src/frontier/domain/experimental_read.py"
          replace_once(
              domain,
              '''EXPERIMENTAL_READ_UNAVAILABLE = "UNAVAILABLE"\nEXPERIMENTAL_READ_INVALID_LIMIT = "INVALID_LIMIT"''',
              '''EXPERIMENTAL_READ_UNAVAILABLE = "UNAVAILABLE"\nEXPERIMENTAL_READ_AS_OF_SINGLE_BOUNDARY = "SINGLE_BOUNDARY"\nEXPERIMENTAL_READ_AS_OF_MIXED_BOUNDARIES = "MIXED_BOUNDARIES"\nEXPERIMENTAL_READ_INVALID_LIMIT = "INVALID_LIMIT"''',
          )
          replace_once(
              domain,
              '''    configuration_digest: str\n    as_of: str\n    generated_at: str\n    availability: dict[str, str]\n    latest_shadow_run: ShadowRunSummary | None''',
              '''    configuration_digest: str\n    as_of: str\n    as_of_consistency: str\n    generated_at: str\n    availability: dict[str, str]\n    latest_shadow_run: ShadowRunSummary | None''',
          )
          replace_once(
              domain,
              '''    generated_candidates = [\n        item.generated_at\n        for item in (shadow_run, pef_artifact, evaluation_receipt, feature_batch)\n        if item is not None\n    ]''',
              '''    section_as_ofs = {\n        item.as_of\n        for item in (shadow_run, pef_artifact, evaluation_receipt, feature_batch)\n        if item is not None\n    }\n    section_as_ofs.update(item.as_of for item in analysis_artifacts.values())\n    any_section_failed = (\n        shadow_run_failed\n        or pef_artifact_failed\n        or evaluation_receipt_failed\n        or feature_batch_failed\n        or analysis_failed\n    )\n    if any_section_failed:\n        as_of_consistency = EXPERIMENTAL_READ_UNKNOWN\n    elif not section_as_ofs:\n        as_of_consistency = EXPERIMENTAL_READ_NO_DATA\n    elif len(section_as_ofs) == 1:\n        as_of_consistency = EXPERIMENTAL_READ_AS_OF_SINGLE_BOUNDARY\n    else:\n        as_of_consistency = EXPERIMENTAL_READ_AS_OF_MIXED_BOUNDARIES\n\n    generated_candidates = [\n        item.generated_at\n        for item in (shadow_run, pef_artifact, evaluation_receipt, feature_batch)\n        if item is not None\n    ]''',
          )
          replace_once(
              domain,
              '''        configuration_digest=str(PEF_CONFIGURATION_DIGEST),\n        as_of=resolved_as_of,\n        generated_at=resolved_generated_at,''',
              '''        configuration_digest=str(PEF_CONFIGURATION_DIGEST),\n        as_of=resolved_as_of,\n        as_of_consistency=as_of_consistency,\n        generated_at=resolved_generated_at,''',
          )

          api = "src/frontier/adapters/api/experimental_read.py"
          replace_once(
              api,
              '''class ExperimentalOverviewResponse(BaseModel):\n    model_config = _forbid()\n\n    schema_version: str = EXPERIMENTAL_READ_SCHEMA_VERSION\n    authority_state: str = EXPERIMENTAL_READ_AUTHORITY_STATE\n    interpretation: str = EXPERIMENTAL_READ_INTERPRETATION\n    experiment_id: str\n    candidate_id: str\n    configuration_digest: str\n    as_of: str\n    generated_at: str''',
              '''class ExperimentalOverviewResponse(BaseModel):\n    model_config = _forbid()\n\n    schema_version: str = EXPERIMENTAL_READ_SCHEMA_VERSION\n    authority_state: str = EXPERIMENTAL_READ_AUTHORITY_STATE\n    interpretation: str = EXPERIMENTAL_READ_INTERPRETATION\n    experiment_id: str\n    candidate_id: str\n    configuration_digest: str\n    as_of: str\n    as_of_consistency: str\n    generated_at: str''',
          )
          replace_once(
              api,
              '''            "configuration_digest": overview.configuration_digest,\n            "as_of": overview.as_of,\n            "generated_at": overview.generated_at,''',
              '''            "configuration_digest": overview.configuration_digest,\n            "as_of": overview.as_of,\n            "as_of_consistency": overview.as_of_consistency,\n            "generated_at": overview.generated_at,''',
          )

          unit = "tests/unit/test_experimental_read.py"
          replace_once(
              unit,
              '''from __future__ import annotations\n\nfrom datetime import UTC, datetime''',
              '''from __future__ import annotations\n\nfrom dataclasses import replace\nfrom datetime import UTC, datetime''',
          )
          replace_once(
              unit,
              '''    EXPERIMENTAL_READ_AUTHORITY_STATE,\n    EXPERIMENTAL_READ_AVAILABLE,''',
              '''    EXPERIMENTAL_READ_AS_OF_MIXED_BOUNDARIES,\n    EXPERIMENTAL_READ_AS_OF_SINGLE_BOUNDARY,\n    EXPERIMENTAL_READ_AUTHORITY_STATE,\n    EXPERIMENTAL_READ_AVAILABLE,''',
          )
          replace_once(
              unit,
              '''    assert overview.as_of == EXPERIMENTAL_READ_UNKNOWN\n    assert overview.generated_at == EXPERIMENTAL_READ_UNKNOWN''',
              '''    assert overview.as_of == EXPERIMENTAL_READ_UNKNOWN\n    assert overview.as_of_consistency == EXPERIMENTAL_READ_NO_DATA\n    assert overview.generated_at == EXPERIMENTAL_READ_UNKNOWN''',
          )
          replace_once(
              unit,
              '''    assert overview.as_of == AS_OF_TEXT\n    assert overview.availability["shadow_run"] == EXPERIMENTAL_READ_AVAILABLE''',
              '''    assert overview.as_of == AS_OF_TEXT\n    assert overview.as_of_consistency == EXPERIMENTAL_READ_AS_OF_SINGLE_BOUNDARY\n    assert overview.availability["shadow_run"] == EXPERIMENTAL_READ_AVAILABLE''',
          )
          replace_once(
              unit,
              '''def test_service_maps_repository_failure_to_unknown() -> None:\n    service = ExperimentalReadService(_RecordingRepository(fail=True))''',
              '''def test_overview_marks_mixed_as_of_boundaries_explicitly() -> None:\n    later = replace(\n        _analysis_summary(ExperimentalAnalysisKind.INDICATORS),\n        as_of="2026-09-05T12:05:00.000000Z",\n    )\n    overview = build_experimental_overview(\n        as_of=None,\n        shadow_run=_shadow_run_summary(),\n        pef_artifact=_pef_artifact_summary(),\n        evaluation_receipt=None,\n        feature_batch=_feature_batch_summary(),\n        analysis_artifacts={ExperimentalAnalysisKind.INDICATORS: later},\n        shadow_run_failed=False,\n        pef_artifact_failed=False,\n        evaluation_receipt_failed=False,\n        feature_batch_failed=False,\n        analysis_failed=False,\n    )\n    assert overview.as_of == "2026-09-05T12:05:00.000000Z"\n    assert overview.as_of_consistency == EXPERIMENTAL_READ_AS_OF_MIXED_BOUNDARIES\n    assert overview.latest_shadow_run is not None\n    assert overview.latest_shadow_run.as_of == AS_OF_TEXT\n\n\ndef test_service_maps_repository_failure_to_unknown() -> None:\n    service = ExperimentalReadService(_RecordingRepository(fail=True))''',
          )
          replace_once(
              unit,
              '''    assert overview.availability["analysis:CORROBORATION"] == EXPERIMENTAL_READ_UNKNOWN\n    assert overview.latest_shadow_run is None''',
              '''    assert overview.availability["analysis:CORROBORATION"] == EXPERIMENTAL_READ_UNKNOWN\n    assert overview.as_of_consistency == EXPERIMENTAL_READ_UNKNOWN\n    assert overview.latest_shadow_run is None''',
          )

          integration = "tests/integration/test_experimental_read_postgres.py"
          replace_once(
              integration,
              '''from frontier.adapters.postgres.experimental_read import (\n    PostgresExperimentalReadRepository,\n)\nfrom frontier.domain.canonical_json import canonical_json_bytes''',
              '''from frontier.adapters.postgres.experimental_read import (\n    PostgresExperimentalReadRepository,\n)\nfrom frontier.application.experimental_read import ExperimentalReadService\nfrom frontier.domain.canonical_json import canonical_json_bytes''',
          )
          replace_once(
              integration,
              '''def test_as_of_horizon_excludes_later_items() -> None:\n    connection, repository = _connect_and_seed()''',
              '''def test_overview_exposes_mixed_as_of_consistency() -> None:\n    connection, repository = _connect_and_seed()\n    try:\n        overview = ExperimentalReadService(repository).get_overview()\n        assert overview.as_of == "2099-01-01T00:05:00.000000Z"\n        assert overview.as_of_consistency == "MIXED_BOUNDARIES"\n        assert overview.latest_shadow_run is not None\n        assert overview.latest_shadow_run.as_of == "2099-01-01T00:00:00.000000Z"\n        assert (\n            overview.analysis_artifacts[ExperimentalAnalysisKind.INDICATORS].as_of\n            == "2099-01-01T00:05:00.000000Z"\n        )\n    finally:\n        connection.close()\n\n\ndef test_as_of_horizon_excludes_later_items() -> None:\n    connection, repository = _connect_and_seed()''',
          )
          PY
      - name: Format and regenerate contracts
        run: |
          uv run ruff format \
            src/frontier/domain/experimental_read.py \
            src/frontier/adapters/api/experimental_read.py \
            tests/unit/test_experimental_read.py \
            tests/integration/test_experimental_read_postgres.py
          uv run python scripts/generate_public_contracts.py
      - name: Focused verification
        run: |
          uv run alembic upgrade head
          uv run ruff check \
            src/frontier/domain/experimental_read.py \
            src/frontier/adapters/api/experimental_read.py \
            tests/unit/test_experimental_read.py \
            tests/integration/test_experimental_read_postgres.py
          uv run pytest -q tests/unit/test_experimental_read.py tests/integration/test_experimental_read_postgres.py
          uv run python scripts/generate_public_contracts.py --check
      - name: Commit bounded D013 repair and remove helper workflow
        run: |
          rm .github/workflows/d013-boundary-consistency-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/frontier/domain/experimental_read.py \
            src/frontier/adapters/api/experimental_read.py \
            tests/unit/test_experimental_read.py \
            tests/integration/test_experimental_read_postgres.py \
            contracts/public/openapi_v0.json \
            clients/typescript/src/generated/public_read_v0.ts \
            .github/workflows/d013-boundary-consistency-patch.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(read): expose overview boundary consistency"
          git push origin HEAD:feature/post-pef-v0-d013-overview-boundary-consistency
