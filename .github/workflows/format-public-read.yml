name: format-public-read

on:
  push:
    branches: [agent/public-read-plane-v0]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
      - name: Sync frozen environment
        run: uv sync --all-extras --frozen
      - name: Format
        run: uv run ruff format --exclude scripts/preflight .
      - name: Commit mechanical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_public_contracts.py src/frontier/application/public_read.py src/frontier/domain/public_read.py tests/integration/test_public_read_plane_postgres.py tests/unit/test_public_read_api.py
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style(read-plane): apply ruff formatting"
          git push origin HEAD:agent/public-read-plane-v0
