name: temp-format-grouping-v1

on:
  push:
    branches: [feature/grouping-scalability-v1]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/grouping-scalability-v1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Sync frozen environment
        run: uv sync --all-extras --frozen
      - name: Format bounded V1 files
        run: uv run ruff format src/frontier/domain/grouping_v1.py tests/unit/test_grouping_scalability_v1.py scripts/ops/measure_grouping_scalability_v1.py
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontier/domain/grouping_v1.py tests/unit/test_grouping_scalability_v1.py scripts/ops/measure_grouping_scalability_v1.py
          if ! git diff --cached --quiet; then
            git commit -m "chore(grouping): format V1 implementation"
            git push origin HEAD:feature/grouping-scalability-v1
          fi
