name: temp-evidence-query-v0-patch

on:
  push:
    branches:
      - feature/post-pef-v0-evidence-query-v0
    paths:
      - .github/workflows/_temp_evidence_query_patch.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/post-pef-v0-evidence-query-v0
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.12.10'
          enable-cache: true
      - name: Verify authority predates runtime
        run: |
          test "$(git rev-list --count 7430c9a5f5ff84900212412d8c9fbd8a7d5a25ae..HEAD -- docs/EVIDENCE_QUERY_V0.md)" -ge 1
          test "$(git rev-list --count 7430c9a5f5ff84900212412d8c9fbd8a7d5a25ae..HEAD -- fixtures/evidence_query/corpus_v0.json)" -ge 1
      - name: Sync frozen environment
        run: uv sync --all-extras --frozen
      - name: Apply bounded runtime changes
        run: python scripts/_temp_evidence_query_patch.py
      - name: Remove redundant API-test cast
        run: |
          python -c 'from pathlib import Path; p=Path("tests/unit/test_public_read_api.py"); t=p.read_text(); old="    assert cast(dict[str, Any], response.json()) == {"; assert t.count(old) == 1; p.write_text(t.replace(old, "    assert response.json() == {", 1))'
      - name: Format bounded product changes
        run: |
          uv run ruff format src/frontier/domain/public_read.py src/frontier/application/public_read.py src/frontier/adapters/api/public_read.py tests/unit/test_public_read.py tests/unit/test_public_read_api.py scripts/generate_public_contracts.py
          uv run ruff check --fix src/frontier/application/public_read.py
          uv run ruff format src/frontier/application/public_read.py
      - name: Generate deterministic public contracts
        run: uv run python scripts/generate_public_contracts.py
      - name: Focused EVIDENCE_QUERY_V0 tests
        run: uv run pytest -q tests/unit/test_public_read.py tests/unit/test_public_read_api.py
      - name: Remove temporary helper before repository verification
        run: rm scripts/_temp_evidence_query_patch.py
      - name: Full repository verification
        run: uv run python scripts/verify.py
      - name: Guard frozen PEF surfaces
        run: |
          git diff --exit-code 7430c9a5f5ff84900212412d8c9fbd8a7d5a25ae -- experiments/advanced_intelligence/pef_v0/preregistration.json ops/pef_v0_confirmatory_vm
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontier/domain/public_read.py src/frontier/application/public_read.py src/frontier/adapters/api/public_read.py tests/unit/test_public_read.py tests/unit/test_public_read_api.py scripts/generate_public_contracts.py contracts/public/openapi_v0.json clients/typescript/src/generated/public_read_v0.ts
          git diff --cached --check
          git commit -m "feat(read): add deterministic evidence query v0"
          git push origin HEAD:feature/post-pef-v0-evidence-query-v0
