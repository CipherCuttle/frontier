name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: frontier
          POSTGRES_PASSWORD: frontier
          POSTGRES_DB: frontier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frontier -d frontier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FRONTIER_TEST_DATABASE_URL: postgresql://frontier:frontier@localhost:5432/frontier
      FRONTIER_DATABASE_URL: postgresql+psycopg://frontier:frontier@localhost:5432/frontier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Resolve bootstrap lock
        run: uv lock
      - name: Commit bootstrap lock to PR branch
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e HEAD:uv.lock 2>/dev/null; then
            echo "uv.lock already tracked"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: freeze Python dependency lock"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Sync
        run: uv sync --all-extras
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Verify
        run: uv run python scripts/verify.py
