name: GIGASPRINT02 G2-01 construction guard

on:
  push:
    branches:
      - agent/gigasprint-02-prefreeze-launch-integrity

permissions:
  contents: write

jobs:
  patch-and-test:
    if: "${{ github.event.head_commit.message == 'chore(gigasprint02): apply frozen-registry construction guard' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gigasprint-02-prefreeze-launch-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Apply confirmatory frozen-registry construction guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: guarded fragment count={text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/frontier/application/experiment_orchestration.py",
              '''        if run_class not in RUN_CLASSES:\n            raise ValueError("run_class must be DEV or CONFIRMATORY")\n        if lease_seconds <= 0:\n''',
              '''        if run_class not in RUN_CLASSES:\n            raise ValueError("run_class must be DEV or CONFIRMATORY")\n        if run_class == RUN_CLASS_CONFIRMATORY:\n            confirmatory_registry = getattr(\n                baseline_repository, "confirmatory_source_registry_version", None\n            )\n            if confirmatory_registry != source_registry_version:\n                raise ValueError(\n                    "CONFIRMATORY requires a baseline repository bound to the frozen "\n                    "source registry"\n                )\n        if lease_seconds <= 0:\n''',
          )

          replace_once(
              "tests/unit/test_experiment_orchestration.py",
              '''    def __init__(self, observations: tuple[BaselineObservationInput, ...]) -> None:\n        self.observations = observations\n        self.published: list[tuple[BaselineSnapshot, object]] = []\n''',
              '''    def __init__(\n        self,\n        observations: tuple[BaselineObservationInput, ...],\n        *,\n        confirmatory_source_registry_version: Digest | None = None,\n    ) -> None:\n        self.observations = observations\n        self.published: list[tuple[BaselineSnapshot, object]] = []\n        self.confirmatory_source_registry_version = confirmatory_source_registry_version\n''',
          )

          replace_once(
              "tests/unit/test_experiment_orchestration.py",
              '''    baseline = FakeBaselineRepository(observations if observations is not None else _observations())\n    orchestrator = ExperimentOrchestrator(\n''',
              '''    baseline = FakeBaselineRepository(\n        observations if observations is not None else _observations(),\n        confirmatory_source_registry_version=(\n            REGISTRY if run_class == RUN_CLASS_CONFIRMATORY else None\n        ),\n    )\n    orchestrator = ExperimentOrchestrator(\n''',
          )

          test_path = Path("tests/unit/test_experiment_orchestration.py")
          text = test_path.read_text()
          anchor = '''\ndef test_derive_experiment_boundary_is_epoch_multiple_of_cadence() -> None:\n'''
          if text.count(anchor) != 1:
              raise SystemExit("unit-test anchor mismatch")
          test = '''\ndef test_confirmatory_construction_requires_frozen_registry_bound_baseline() -> None:\n    broad_baseline = FakeBaselineRepository(_observations())\n    with pytest.raises(\n        ValueError,\n        match="CONFIRMATORY requires a baseline repository bound to the frozen source registry",\n    ):\n        ExperimentOrchestrator(\n            attempts=FakeAttemptRepository(),\n            baseline_repository=broad_baseline,\n            persistence=FakeShadowRunPersistence(),\n            source_registry_version=REGISTRY,\n            run_class=RUN_CLASS_CONFIRMATORY,\n            canonical_context=True,\n        )\n\n    wrong_registry_baseline = FakeBaselineRepository(\n        _observations(),\n        confirmatory_source_registry_version=Digest("sha256:" + "9" * 64),\n    )\n    with pytest.raises(\n        ValueError,\n        match="CONFIRMATORY requires a baseline repository bound to the frozen source registry",\n    ):\n        ExperimentOrchestrator(\n            attempts=FakeAttemptRepository(),\n            baseline_repository=wrong_registry_baseline,\n            persistence=FakeShadowRunPersistence(),\n            source_registry_version=REGISTRY,\n            run_class=RUN_CLASS_CONFIRMATORY,\n            canonical_context=True,\n        )\n\n\n'''
          test_path.write_text(text.replace(anchor, test + anchor, 1))
          PY

      - name: Verify G2-01 construction guard
        shell: bash
        run: |
          uv lock --check
          uv sync --all-extras --frozen
          uv run ruff format src/frontier/application/experiment_orchestration.py src/frontier/adapters/postgres/frozen_registry_intelligence.py tests/unit/test_experiment_orchestration.py
          uv run ruff check src/frontier/application/experiment_orchestration.py src/frontier/adapters/postgres/frozen_registry_intelligence.py tests/unit/test_experiment_orchestration.py
          uv run pyright src/frontier/application/experiment_orchestration.py src/frontier/adapters/postgres/frozen_registry_intelligence.py
          uv run pytest -q tests/unit/test_experiment_orchestration.py

      - name: Commit guard and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gigasprint02-g201-guard.yml
          git add src/frontier/application/experiment_orchestration.py src/frontier/adapters/postgres/frozen_registry_intelligence.py tests/unit/test_experiment_orchestration.py
          git commit -m "fix(pef): require frozen registry for confirmatory construction"
          git push origin HEAD:agent/gigasprint-02-prefreeze-launch-integrity
