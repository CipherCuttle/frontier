name: terminal-lock-refresh

on:
  push:
    branches: [agent/terminal-v0]
    paths:
      - "web/terminal/package.json"
      - ".github/workflows/terminal-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/terminal-v0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/terminal/package.json
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --prefix web/terminal
      - name: Commit frozen lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/terminal/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build(terminal): freeze npm dependency graph"
          git push origin HEAD:agent/terminal-v0
