name: GIGASPRINT02 D012 one-shot patch

on:
  push:
    branches:
      - agent/gigasprint-02-prefreeze-launch-integrity

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(gigasprint02): bootstrap guarded D012 repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gigasprint-02-prefreeze-launch-integrity
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Apply fail-closed repository authorization repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one old fragment, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/frontier/adapters/postgres/advanced_intelligence.py",
              '''class PostgresCandidateFreezeRepository:\n    """Append-only persistence for candidate freeze receipts (R8)."""\n\n    def __init__(self, connection: psycopg.Connection[tuple[object, ...]]) -> None:\n        self._connection = connection\n\n    def record_receipt(self, receipt: CandidateFreezeReceipt) -> None:\n        if receipt.candidate_id != PEF_CANDIDATE_ID:\n''',
              '''class PostgresCandidateFreezeRepository:\n    """Append-only persistence for candidate freeze receipts (R8).\n\n    Writes are fail-closed by default. Read-only callers may construct the\n    repository normally, but any code path that persists a candidate freeze\n    must opt in explicitly after its own human/operator authorization gate.\n    This keeps the safety boundary below the CLI so a future non-CLI caller\n    cannot accidentally persist a real freeze merely by reaching this adapter.\n    """\n\n    def __init__(\n        self,\n        connection: psycopg.Connection[tuple[object, ...]],\n        *,\n        persistence_authorized: bool = False,\n    ) -> None:\n        self._connection = connection\n        self._persistence_authorized = persistence_authorized\n\n    def record_receipt(self, receipt: CandidateFreezeReceipt) -> None:\n        if not self._persistence_authorized:\n            raise PermissionError("candidate freeze persistence is not authorized")\n        if receipt.candidate_id != PEF_CANDIDATE_ID:\n''',
          )

          replace_once(
              "src/frontier/cli/main.py",
              '''        PostgresCandidateFreezeRepository(conn).record_receipt(receipt)\n''',
              '''        PostgresCandidateFreezeRepository(\n            conn, persistence_authorized=True\n        ).record_receipt(receipt)\n''',
          )

          replace_once(
              "tests/integration/test_candidate_freeze_postgres.py",
              '''        repository = PostgresCandidateFreezeRepository(conn)\n        repository.record_receipt(receipt)\n''',
              '''        repository = PostgresCandidateFreezeRepository(\n            conn, persistence_authorized=True\n        )\n        repository.record_receipt(receipt)\n''',
          )

          replace_once(
              "tests/integration/test_candidate_freeze_postgres.py",
              '''        repository = PostgresCandidateFreezeRepository(conn)\n        repository.record_receipt(receipt)\n        assert repository.latest_receipt_id() == receipt.receipt_id\n        assert receipt.receipt_id.startswith(FREEZE_RECEIPT_ID_PREFIX)\n''',
              '''        repository = PostgresCandidateFreezeRepository(\n            conn, persistence_authorized=True\n        )\n        repository.record_receipt(receipt)\n        assert repository.latest_receipt_id() == receipt.receipt_id\n        assert receipt.receipt_id.startswith(FREEZE_RECEIPT_ID_PREFIX)\n''',
          )

          test_path = Path("tests/integration/test_candidate_freeze_postgres.py")
          test_text = test_path.read_text()
          anchor = '''\ndef test_postgres_candidate_freeze_receipt_persists_and_is_append_only() -> None:\n'''
          if test_text.count(anchor) != 1:
              raise SystemExit("candidate freeze integration test anchor mismatch")
          denial_test = '''\ndef test_postgres_candidate_freeze_repository_refuses_unauthorized_write() -> None:\n    assert DB_URL is not None\n    receipt = freeze_candidate(REPO_ROOT, frozen_at=datetime.now(UTC))\n    assert receipt.status is FreezeStatus.FROZEN\n\n    with psycopg.connect(DB_URL) as conn:\n        repository = PostgresCandidateFreezeRepository(conn)\n        with pytest.raises(\n            PermissionError, match="candidate freeze persistence is not authorized"\n        ):\n            repository.record_receipt(receipt)\n        with conn.cursor() as cur:\n            cur.execute(\n                "SELECT COUNT(*) FROM candidate_freeze_receipts WHERE receipt_id = %s",\n                (receipt.receipt_id,),\n            )\n            assert cur.fetchone() == (0,)\n\n\n'''
          test_path.write_text(test_text.replace(anchor, denial_test + anchor, 1))
          PY

      - name: Verify focused repair
        shell: bash
        run: |
          uv lock --check
          uv sync --all-extras --frozen
          uv run ruff format src/frontier/adapters/postgres/advanced_intelligence.py src/frontier/cli/main.py tests/integration/test_candidate_freeze_postgres.py
          uv run ruff check src/frontier/adapters/postgres/advanced_intelligence.py src/frontier/cli/main.py tests/integration/test_candidate_freeze_postgres.py
          uv run pyright src/frontier/adapters/postgres/advanced_intelligence.py src/frontier/cli/main.py
          uv run pytest -q tests/unit/test_freeze_cli.py

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gigasprint02-d012-patch.yml
          git add src/frontier/adapters/postgres/advanced_intelligence.py src/frontier/cli/main.py tests/integration/test_candidate_freeze_postgres.py
          git commit -m "fix(freeze): enforce persistence authorization below CLI"
          git push origin HEAD:agent/gigasprint-02-prefreeze-launch-integrity
