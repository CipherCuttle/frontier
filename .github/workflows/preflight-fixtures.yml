name: preflight-fixtures

on:
  pull_request:
    paths:
      - "fixtures/acquisition/**"
      - "docs/preflight/PR02_*"
      - "scripts/preflight/validate_acquisition_corpus.py"
      - ".github/workflows/preflight-fixtures.yml"
  push:
    branches: [main]
    paths:
      - "fixtures/acquisition/**"
      - "docs/preflight/PR02_*"
      - "scripts/preflight/validate_acquisition_corpus.py"
      - ".github/workflows/preflight-fixtures.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Validate hostile acquisition corpus
        run: python scripts/preflight/validate_acquisition_corpus.py
